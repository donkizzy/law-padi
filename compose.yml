services:

  proxy:
    image: traefik:3.6
    volumes:
      # Add Docker as a mounted volume, so that Traefik can read the labels of other services
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      # Enable Docker in Traefik, so that it reads labels from Docker services
      - --providers.docker
      # Do not expose all Docker services, only the ones explicitly exposed
      - --providers.docker.exposedbydefault=false
      # Create an entrypoint "http" listening on port 80
      - --entrypoints.http.address=:80
      # Enable the access log, with HTTP requests
      - --accesslog
      # Enable the Traefik log, for configurations and errors
      - --log

  db:
    image: pgvector/pgvector:0.8.6-pg18
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    volumes:
      - app-db-data:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Variable not set}
      - POSTGRES_DB=app

  backend:
    image: backend:latest
    depends_on:
      db:
        condition: service_healthy
        restart: true
    environment:
      PROJECT_NAME: ${PROJECT_NAME:?Variable not set}
      # The browser origin trusted for CORS and session changes.
      FRONTEND_HOST: ${FRONTEND_HOST:-http://localhost:5173}
      SECRET_KEY: ${SECRET_KEY:?Variable not set}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER:?Variable not set}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:?Variable not set}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      EMAILS_FROM_EMAIL: ${EMAILS_FROM_EMAIL}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Variable not set}@db:5432/app
      # Default budget: 2 web processes × 15 + 10 ingestion + 10 chat = 50
      # of 100 PostgreSQL connections; reserve the rest for operators and overhead.
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-15}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.05}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      # Empty selects JSON lines; set "text" for a readable terminal.
      LOG_FORMAT: ${LOG_FORMAT:-}
      INGESTION_STORAGE_BACKEND: ${INGESTION_STORAGE_BACKEND:-local}
      INGESTION_ALLOWED_INSTRUMENT_TYPES: '${INGESTION_ALLOWED_INSTRUMENT_TYPES:-["constitution"]}'
      INGESTION_STORAGE_DIR: /app/backend/storage/source-documents
      INGESTION_STAGE_CONCURRENCY_LIMITS: "${INGESTION_STAGE_CONCURRENCY_LIMITS:-{}}"
      MALWARE_SCANNER_BACKEND: ${MALWARE_SCANNER_BACKEND:-static_pdf}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT_SECONDS: ${CLAMAV_TIMEOUT_SECONDS:-15}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HUGGINGFACE_TEI_ENDPOINT_URL: ${HUGGINGFACE_TEI_ENDPOINT_URL:-}
      HUGGINGFACE_API_TOKEN: ${HUGGINGFACE_API_TOKEN:-}
      RETRIEVAL_INDEX_BACKEND: ${RETRIEVAL_INDEX_BACKEND:-pgvector}
      RETRIEVAL_VECTOR_DIMENSIONS: ${RETRIEVAL_VECTOR_DIMENSIONS:-1024}
      RETRIEVAL_DENSE_CANDIDATE_LIMIT: ${RETRIEVAL_DENSE_CANDIDATE_LIMIT:-50}
      RETRIEVAL_LEXICAL_CANDIDATE_LIMIT: ${RETRIEVAL_LEXICAL_CANDIDATE_LIMIT:-50}
      RETRIEVAL_RRF_K: ${RETRIEVAL_RRF_K:-60}
      CITATION_LOOKUP_ENABLED: ${CITATION_LOOKUP_ENABLED:-true}
      CHAT_ENABLED: ${CHAT_ENABLED:-false}
      CHAT_GENERATION_ENABLED: ${CHAT_GENERATION_ENABLED:-false}
      CHAT_GENERATION_KILL_SWITCH: ${CHAT_GENERATION_KILL_SWITCH:-false}
      CHAT_MAX_ACTIVE_GENERATIONS: ${CHAT_MAX_ACTIVE_GENERATIONS:-100}
      CHAT_PROVIDER_CAPACITY_APPROVED: ${CHAT_PROVIDER_CAPACITY_APPROVED:-false}
      CHAT_GUEST_DAILY_LIMIT: ${CHAT_GUEST_DAILY_LIMIT:-20}
      CHAT_ACCOUNT_DAILY_LIMIT: ${CHAT_ACCOUNT_DAILY_LIMIT:-200}
      CHAT_GUEST_BURST_LIMIT: ${CHAT_GUEST_BURST_LIMIT:-3}
      CHAT_ACCOUNT_BURST_LIMIT: ${CHAT_ACCOUNT_BURST_LIMIT:-10}
      CHAT_DAILY_BUDGET_USD: ${CHAT_DAILY_BUDGET_USD:-100}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      CHAT_LANGUAGES_ENABLED: ${CHAT_LANGUAGES_ENABLED:-["en","pcm","yo","ha","ig"]}
      MANAGED_OCR_PROVIDER: ${MANAGED_OCR_PROVIDER:-disabled}
      GOOGLE_DOCUMENT_AI_PROCESSOR_NAME: ${GOOGLE_DOCUMENT_AI_PROCESSOR_NAME:-}
      GOOGLE_DOCUMENT_AI_ACCESS_TOKEN: ${GOOGLE_DOCUMENT_AI_ACCESS_TOKEN:-}
      AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT: ${AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT:-}
      AZURE_DOCUMENT_INTELLIGENCE_KEY: ${AZURE_DOCUMENT_INTELLIGENCE_KEY:-}
      AZURE_DOCUMENT_INTELLIGENCE_MODEL_ID: ${AZURE_DOCUMENT_INTELLIGENCE_MODEL_ID:-prebuilt-layout}
      AZURE_DOCUMENT_INTELLIGENCE_API_VERSION: ${AZURE_DOCUMENT_INTELLIGENCE_API_VERSION:-2024-11-30}

    healthcheck:
      # Readiness: the database answers and its schema is at this build's head.
      # Traefik holds traffic back from a container that is not healthy.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz', timeout=4).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 2s

    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        BUILD_REVISION: ${BUILD_REVISION:-development}
    volumes:
      - app-ingestion-source-documents:/app/backend/storage/source-documents
    labels:
      # Enable Traefik for this service
      - traefik.enable=true

      # Define the port inside of the Docker service to use
      - traefik.http.services.backend.loadbalancer.server.port=8000

      # Route HTTP traffic for this domain
      - traefik.http.routers.backend-http.rule=Host(`${DOMAIN:-localhost}`)
      - traefik.http.routers.backend-http.entrypoints=http

  ingestion-worker:
    image: ingestion-worker:latest
    depends_on:
      db:
        condition: service_healthy
        restart: true
    environment:
      PROJECT_NAME: ${PROJECT_NAME:?Variable not set}
      SECRET_KEY: ${SECRET_KEY:?Variable not set}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER:?Variable not set}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:?Variable not set}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Variable not set}@db:5432/app
      DATABASE_POOL_SIZE: ${INGESTION_DATABASE_POOL_SIZE:-10}
      SENTRY_DSN: ${SENTRY_DSN:-}
      LOG_FORMAT: ${LOG_FORMAT:-}
      INGESTION_STORAGE_BACKEND: ${INGESTION_STORAGE_BACKEND:-local}
      INGESTION_ALLOWED_INSTRUMENT_TYPES: '${INGESTION_ALLOWED_INSTRUMENT_TYPES:-["constitution"]}'
      INGESTION_STORAGE_DIR: /app/backend/storage/source-documents
      INGESTION_STAGE_CONCURRENCY_LIMITS: "${INGESTION_STAGE_CONCURRENCY_LIMITS:-{}}"
      MALWARE_SCANNER_BACKEND: ${MALWARE_SCANNER_BACKEND:-static_pdf}
      CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      CLAMAV_TIMEOUT_SECONDS: ${CLAMAV_TIMEOUT_SECONDS:-15}
      INGESTION_WORKER_ID: ${INGESTION_WORKER_ID:-ingestion-worker}
      INGESTION_WORKER_POLL_INTERVAL_SECONDS: ${INGESTION_WORKER_POLL_INTERVAL_SECONDS:-5}
      INGESTION_WORKER_LEASE_SECONDS: ${INGESTION_WORKER_LEASE_SECONDS:-900}
      INGESTION_WORKER_MAX_TASKS_PER_POLL: ${INGESTION_WORKER_MAX_TASKS_PER_POLL:-10}
      INGESTION_WORKER_TASK_TYPE: ${INGESTION_WORKER_TASK_TYPE:-}
      INGESTION_OUTBOX_SINK_PATH: ${INGESTION_OUTBOX_SINK_PATH:-/app/backend/storage/source-documents/outbox-events.jsonl}
      INGESTION_WORKER_HEARTBEAT_FILE: /tmp/ingestion-worker.heartbeat
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HUGGINGFACE_TEI_ENDPOINT_URL: ${HUGGINGFACE_TEI_ENDPOINT_URL:-}
      HUGGINGFACE_API_TOKEN: ${HUGGINGFACE_API_TOKEN:-}
      RETRIEVAL_INDEX_BACKEND: ${RETRIEVAL_INDEX_BACKEND:-pgvector}
      RETRIEVAL_VECTOR_DIMENSIONS: ${RETRIEVAL_VECTOR_DIMENSIONS:-1024}
      RETRIEVAL_DENSE_CANDIDATE_LIMIT: ${RETRIEVAL_DENSE_CANDIDATE_LIMIT:-50}
      RETRIEVAL_LEXICAL_CANDIDATE_LIMIT: ${RETRIEVAL_LEXICAL_CANDIDATE_LIMIT:-50}
      RETRIEVAL_RRF_K: ${RETRIEVAL_RRF_K:-60}
      MANAGED_OCR_PROVIDER: ${MANAGED_OCR_PROVIDER:-disabled}
      GOOGLE_DOCUMENT_AI_PROCESSOR_NAME: ${GOOGLE_DOCUMENT_AI_PROCESSOR_NAME:-}
      GOOGLE_DOCUMENT_AI_ACCESS_TOKEN: ${GOOGLE_DOCUMENT_AI_ACCESS_TOKEN:-}
      AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT: ${AZURE_DOCUMENT_INTELLIGENCE_ENDPOINT:-}
      AZURE_DOCUMENT_INTELLIGENCE_KEY: ${AZURE_DOCUMENT_INTELLIGENCE_KEY:-}
      AZURE_DOCUMENT_INTELLIGENCE_MODEL_ID: ${AZURE_DOCUMENT_INTELLIGENCE_MODEL_ID:-prebuilt-layout}
      AZURE_DOCUMENT_INTELLIGENCE_API_VERSION: ${AZURE_DOCUMENT_INTELLIGENCE_API_VERSION:-2024-11-30}
    healthcheck:
      # The worker loop touches the file on every poll and at stage checkpoints.
      # Unhealthy after this many poll intervals without a beat.
      test: ["CMD", "python", "-m", "app.core.heartbeat", "/tmp/ingestion-worker.heartbeat", "--interval", "${INGESTION_WORKER_POLL_INTERVAL_SECONDS:-5}", "--intervals", "${INGESTION_WORKER_HEARTBEAT_INTERVALS:-60}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    build:
      context: .
      dockerfile: services/ingestion-worker/Dockerfile
    volumes:
      - app-ingestion-source-documents:/app/backend/storage/source-documents

  chat-worker:
    image: backend:latest
    depends_on:
      db:
        condition: service_healthy
        restart: true
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        BUILD_REVISION: ${BUILD_REVISION:-development}
    command: ["python", "-m", "app.chat.worker"]
    healthcheck:
      # The worker loop touches the file every iteration, at most 2 seconds
      # apart. Unhealthy after this many intervals without a beat.
      test: ["CMD", "python", "-m", "app.core.heartbeat", "/tmp/chat-worker.heartbeat", "--interval", "2", "--intervals", "${CHAT_WORKER_HEARTBEAT_INTERVALS:-30}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    environment:
      PROJECT_NAME: ${PROJECT_NAME:?Variable not set}
      SECRET_KEY: ${SECRET_KEY:?Variable not set}
      FIRST_SUPERUSER: ${FIRST_SUPERUSER:?Variable not set}
      FIRST_SUPERUSER_PASSWORD: ${FIRST_SUPERUSER_PASSWORD:?Variable not set}
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Variable not set}@db:5432/app
      DATABASE_POOL_SIZE: ${CHAT_WORKER_DATABASE_POOL_SIZE:-10}
      CHAT_WORKER_HEARTBEAT_FILE: /tmp/chat-worker.heartbeat
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.05}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      LOG_FORMAT: ${LOG_FORMAT:-}
      INGESTION_STORAGE_BACKEND: ${INGESTION_STORAGE_BACKEND:-local}
      INGESTION_ALLOWED_INSTRUMENT_TYPES: '${INGESTION_ALLOWED_INSTRUMENT_TYPES:-["constitution"]}'
      INGESTION_STORAGE_DIR: /app/backend/storage/source-documents
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      HUGGINGFACE_TEI_ENDPOINT_URL: ${HUGGINGFACE_TEI_ENDPOINT_URL:-}
      HUGGINGFACE_API_TOKEN: ${HUGGINGFACE_API_TOKEN:-}
      CHAT_ENABLED: ${CHAT_ENABLED:-false}
      CHAT_GENERATION_ENABLED: ${CHAT_GENERATION_ENABLED:-false}
      CHAT_GENERATION_KILL_SWITCH: ${CHAT_GENERATION_KILL_SWITCH:-false}
      CHAT_MAX_ACTIVE_GENERATIONS: ${CHAT_MAX_ACTIVE_GENERATIONS:-100}
      CHAT_WORKER_CONCURRENCY: ${CHAT_WORKER_CONCURRENCY:-16}
      CHAT_PROVIDER_CAPACITY_APPROVED: ${CHAT_PROVIDER_CAPACITY_APPROVED:-false}
      CHAT_GUEST_DAILY_LIMIT: ${CHAT_GUEST_DAILY_LIMIT:-20}
      CHAT_ACCOUNT_DAILY_LIMIT: ${CHAT_ACCOUNT_DAILY_LIMIT:-200}
      CHAT_GUEST_BURST_LIMIT: ${CHAT_GUEST_BURST_LIMIT:-3}
      CHAT_ACCOUNT_BURST_LIMIT: ${CHAT_ACCOUNT_BURST_LIMIT:-10}
      CHAT_DAILY_BUDGET_USD: ${CHAT_DAILY_BUDGET_USD:-100}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
      CHAT_LANGUAGES_ENABLED: ${CHAT_LANGUAGES_ENABLED:-["en","pcm","yo","ha","ig"]}
    volumes:
      - app-ingestion-source-documents:/app/backend/storage/source-documents

volumes:
  app-db-data:
  app-ingestion-source-documents:
