name: Railway CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: railway-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  railway-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      # TypeScript is supplied by the root workspace; the SDK has its own lockfile.
      - run: bun install --frozen-lockfile
      - name: Type-check Railway infrastructure
        run: bun install --frozen-lockfile && bun run typecheck
        working-directory: deployment/railway

  railway-images:
    name: railway-image-${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            dockerfile: backend/Dockerfile
            target: production
            runtime: compose
          - image: ingestion
            dockerfile: services/ingestion-worker/Dockerfile
            target: ''
            runtime: ingestion
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build Railway image without production credentials
        run: |
          args=()
          if [ -n "$BUILD_TARGET" ]; then
            args+=(--target "$BUILD_TARGET")
          fi
          docker build -f "$DOCKERFILE" "${args[@]}" -t "constitution-ng-railway:$IMAGE" .
        env:
          DOCKERFILE: ${{ matrix.dockerfile }}
          BUILD_TARGET: ${{ matrix.target }}
          IMAGE: ${{ matrix.image }}
      - name: Check Railway entry point
        run: docker run --rm --entrypoint sh "constitution-ng-railway:$IMAGE" -n /app/deployment/railway/run.sh
        env:
          IMAGE: ${{ matrix.image }}
      - name: Smoke-test packaged runtime
        run: docker run --rm -i --entrypoint python "constitution-ng-railway:$IMAGE" - "$RUNTIME" < scripts/smoke_docker_image.py
        env:
          IMAGE: ${{ matrix.image }}
          RUNTIME: ${{ matrix.runtime }}

  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install workflow validators
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Validate every workflow with shellcheck
        run: |
          go_bin="$(go env GOPATH)/bin"
          export PATH="$go_bin:$PATH"
          command -v shellcheck
          actionlint
