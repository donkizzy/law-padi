name: Test Backend

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest-known"
      # OCR and rendering tests require these tools in CI.
      - name: Install OCR and PDF rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr poppler-utils
      - name: Configure disposable CI services
        run: cp .env.example .env
      - name: Install locked dependencies
        run: uv sync --frozen
        working-directory: backend
      - run: docker compose up -d --wait db mailpit
      - name: Check backend types and formatting
        run: uv run --frozen bash scripts/lint.sh
        working-directory: backend
      - name: Run tests
        run: uv run --frozen bash scripts/test.sh
        working-directory: backend
      - name: Check deployment helpers
        run: uv run --frozen python -m unittest discover -s deployment/tests
      - run: docker compose down -v --remove-orphans
        if: always()
      - name: Store coverage files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-html
          path: backend/htmlcov
          include-hidden-files: true
          retention-days: 14
      - name: Coverage report
        # Application code with branch coverage: measured 87.19%.
        run: uv run --frozen coverage report --fail-under=87
        working-directory: backend
