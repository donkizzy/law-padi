name: Playwright Tests

on:
  push:
    branches:
    - master
  pull_request:
  workflow_dispatch:
    inputs:
      debug_enabled:
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: 'false'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Set job outputs to values from filter step
    outputs:
      changed: ${{ steps.filter.outputs.changed }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 2
        persist-credentials: false
    # For pull requests it's not necessary to checkout the code but for the main branch it is
    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      id: filter
      with:
        filters: |
          changed:
            - backend/**
            - frontend/**
            - packages/**
            - scripts/**
            - deployment/**
            - '**/Dockerfile*'
            - .dockerignore
            - compose*.yml
            - .env.example
            - package.json
            - bun.lock
            - pyproject.toml
            - backend/pyproject.toml
            - uv.lock
            - .github/workflows/playwright.yml

  typecheck:
    needs:
      - changes
    if: ${{ needs.changes.outputs.changed == 'true' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.3.12
    - run: bun ci
    # Type-checks the app and the browser tests against the generated API client,
    # so a mock that drifts from the API contract fails the pull request.
    - run: bun run typecheck

  # The specs that stub every API call run against the Vite dev server alone:
  # no Docker Compose stack, database or mail catcher.
  test-mocked:
    needs:
      - changes
    if: ${{ needs.changes.outputs.changed == 'true' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.3.12
    - run: bun ci
    - run: bunx playwright install --with-deps chromium
      working-directory: frontend
    - name: Run mocked Playwright tests
      run: bun run test:mocked
      env:
        CI: "true"
    - name: Upload blob report to GitHub Actions Artifacts
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: blob-report-mocked
        path: frontend/blob-report
        include-hidden-files: true
        retention-days: 1
    - name: Upload traces of failed tests
      if: ${{ failure() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: mocked-test-results
        path: frontend/test-results
        include-hidden-files: true
        retention-days: 7

  # Only the specs that use the real backend (login, sign-up, reset-password and
  # the auth setup). It needs the Compose stack, so it is kept small.
  test-playwright:
    needs:
      - changes
    if: ${{ needs.changes.outputs.changed == 'true' }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.3.12
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version-file: .python-version
    - name: Setup tmate session
      uses: mxschmitt/action-tmate@35b54afac29c97fb54faba5b513f8fbd1882f113 # v3.24
      if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.debug_enabled == 'true' }}
      with:
        limit-access-to-actor: true
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version: "latest-known"
    - run: uv sync
      working-directory: backend
    - name: Configure disposable CI services
      # The browser tests load the app from the backend container, so that is
      # the origin the API must trust.
      run: |
        cp .env.example .env
        sed -i 's|^FRONTEND_HOST=.*|FRONTEND_HOST=http://backend:8000|' .env
    - run: bun ci
      working-directory: frontend
    - run: bash scripts/generate-client.sh
    - run: bun run --filter frontend build
    - run: docker compose build
    - run: docker compose down -v --remove-orphans
    - run: docker compose run --rm backend bash scripts/prestart.sh
    - name: Run Playwright tests
      run: docker compose run --rm playwright bunx playwright test --fail-on-flaky-tests --trace=retain-on-failure
    - run: docker compose down -v --remove-orphans
    - name: Upload blob report to GitHub Actions Artifacts
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: blob-report-backend
        path: frontend/blob-report
        include-hidden-files: true
        retention-days: 1

  merge-playwright-reports:
    needs:
      - test-mocked
      - test-playwright
      - changes
    # Merge reports after both Playwright jobs, even if one of them failed
    if: ${{ !cancelled() && needs.changes.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.3.12
    - name: Install dependencies
      run: bun ci
    - name: Download blob reports from GitHub Actions Artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: frontend/all-blob-reports
        pattern: blob-report-*
    # The mocked and full-stack suites use different configs and test
    # directories, which merge-reports cannot combine, so each gets its own report.
    - name: Merge into HTML reports
      run: |
        for suite in mocked backend; do
          [ -d "all-blob-reports/blob-report-$suite" ] || continue
          config=playwright.config.ts
          [ "$suite" = mocked ] && config=playwright.mocked.config.ts
          PLAYWRIGHT_HTML_OUTPUT_DIR="playwright-report/$suite" PLAYWRIGHT_HTML_OPEN=never \
            bunx playwright merge-reports --config "$config" --reporter html "./all-blob-reports/blob-report-$suite"
        done
      working-directory: frontend
    - name: Upload HTML report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: html-report--attempt-${{ github.run_attempt }}
        path: frontend/playwright-report
        retention-days: 30
        include-hidden-files: true

  # https://github.com/marketplace/actions/alls-green#why
  alls-green-playwright:  # This job does nothing and is only used for the branch protection
    if: always()
    needs:
      - typecheck
      - test-mocked
      - test-playwright
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # v1.3.0
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: typecheck, test-mocked, test-playwright
