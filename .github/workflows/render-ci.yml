name: Render CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Delete this Render image job after Railway cutover and the rollback window ends.
  production-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the Render image without production credentials
        run: docker build -f deployment/render/Dockerfile -t constitution-ng-api:ci .
      - name: Verify the image reports its actual source revision
        run: |
          expected="$(python scripts/build_revision.py)"
          actual="$(docker run --rm --entrypoint cat constitution-ng-api:ci /app/source-revision)"
          test "$actual" = "$expected"
      - name: Check the Render startup script
        run: docker run --rm --entrypoint sh constitution-ng-api:ci -n /app/backend/scripts/start-render.sh
      - name: Smoke-test the packaged Render runtime
        run: docker run --rm -i --entrypoint python constitution-ng-api:ci - render < scripts/smoke_docker_image.py
