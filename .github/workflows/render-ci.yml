name: Render CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-and-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - run: bun ci
      - name: Check frontend without modifying sources
        run: bun run lint
      - name: Build the same-origin frontend
        run: |
          export VITE_BUILD_REVISION="$(python scripts/build_revision.py)"
          bun run --filter frontend build
        env:
          VITE_API_URL: ""
      - name: Test the Cloudflare proxy and public pages
        run: bun test deployment/cloudflare/worker.test.ts deployment/cloudflare/public-pages.test.ts deployment/cloudflare/redirect.test.ts

  production-container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the Render image without production credentials
        run: docker build -f deployment/render/Dockerfile -t constitution-ng-api:ci .
      - name: Verify the image reports its actual source revision
        run: |
          expected="$(python scripts/build_revision.py)"
          actual="$(docker run --rm --entrypoint cat constitution-ng-api:ci /app/source-revision)"
          test "$actual" = "$expected"
      - name: Check the Render startup script
        run: docker run --rm --entrypoint sh constitution-ng-api:ci -n /app/backend/scripts/start-render.sh
      - name: Smoke-test the packaged Render runtime
        run: docker run --rm -i --entrypoint python constitution-ng-api:ci - render < scripts/smoke_docker_image.py
