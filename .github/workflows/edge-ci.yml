name: Edge CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-and-edge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.12
      - run: bun ci
      - name: Check frontend without modifying sources
        run: bun run lint
      - name: Build the same-origin frontend
        run: |
          VITE_BUILD_REVISION="$(python scripts/build_revision.py)"
          export VITE_BUILD_REVISION
          bun run --filter frontend build
        env:
          VITE_API_URL: ""
      - name: Test the Cloudflare proxy and public pages
        run: bun test deployment/cloudflare/worker.test.ts deployment/cloudflare/public-pages.test.ts deployment/cloudflare/redirect.test.ts
