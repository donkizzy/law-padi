name: Guard Dependencies

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] -- This workflow only reads context.payload metadata, never checks out PR code
    branches: [master]
    paths:
      - pyproject.toml
      - backend/pyproject.toml
      - uv.lock
      - bun.lock

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-author:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Check if author is a maintainer or allowed bot
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const assoc = pr.author_association;

            const botAllowlist = new Set(['dependabot[bot]']);
            const maintainerAssociations = new Set(['OWNER', 'MEMBER', 'COLLABORATOR']);

            const allowed =
              botAllowlist.has(author) ||
              (assoc != null && maintainerAssociations.has(assoc));

            if (!allowed) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: `This PR modifies dependency files (a lockfile or \`pyproject.toml\`), which only the repository maintainers change.\n\nIf you need a dependency change, please [open an issue](https://github.com/${context.repo.owner}/${context.repo.repo}/issues/new) describing what you need and why.\n\nClosing this PR automatically.`
              });

              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
                state: 'closed'
              });

              core.setFailed('Dependency changes are restricted to repository maintainers.');
            } else {
              console.log(`Author ${author} (author_association=${assoc}) is allowed to make dependency changes.`);
            }
