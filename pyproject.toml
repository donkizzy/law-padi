[dependency-groups]
dev = [
    "prek>=0.4.11,<1.0.0",
    "typer>=0.26.1,<1.0.0",
    "zizmor>=1.28.0",
]

github-actions = [
    "smokeshow >=0.5.0",
]

[tool.uv.workspace]
members = ["backend"]

[tool.typos.files]
extend-exclude = [
    "uv.lock",
    "bun.lock",
    "backend/coverage/",
    "backend/htmlcov/",
    "backend/app/frontend/",
    "frontend/dist/",
    "frontend/public/assets/images/",
    # Reader-language catalogues: Hausa, Igbo, Pidgin and Yoruba words are not
    # English misspellings.
    "frontend/src/locales/ha/",
    "frontend/src/locales/ig/",
    "frontend/src/locales/pcm/",
    "frontend/src/locales/yo/",
]

[tool.typos.default]
extend-ignore-re = [
    # GitHub usernames in @mentions
    "@[a-zA-Z0-9](?:-?[a-zA-Z0-9])*",
    # Name of the package in the PR title
    "Bump certifi ",
]

[tool.typos.default.extend-identifiers]
alls = "alls"

[tool.typos.default.extend-words]
# The deployed Worker's legacy name, kept until it is renamed (PUB-16).
constitition = "constitition"
# The Python CA-bundle package.
certifi = "certifi"
